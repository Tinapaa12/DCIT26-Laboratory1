<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJ | About Me</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .profile-pic {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 1rem auto;
      background-color: #2a2a2a;
      border: 2px solid #333;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    header h1 {
      font-size: 2rem;
    }

    header p {
      color: #a0a0a0;
    }

    section {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #2a2a2a;
    }

    section:last-of-type {
      border-bottom: none;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
    }

    ul {
      list-style: disc;
      padding-left: 1.5rem;
    }

    li {
      margin-bottom: 0.3rem;
    }

    .gallery {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .gallery-item {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      background-color: #2a2a2a;
      border: 2px solid #333;
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: all 0.3s ease;
    }

    .gallery-item:hover {
      width: 220px;
      height: 220px;
      z-index: 2;
      position: relative;
    }

    .gallery-item:hover img {
      object-fit: contain;
      background-color: #000;
    }

    footer {
      text-align: center;
      color: #707070;
      font-size: 0.8rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="profile-pic">
      <img src="487385399_2798251870354803_2892457269281016292_n.jpg" alt="Profile picture">
    </div>
    <h1>TJ</h1>
    <p>BSIT 3-7</p>
  </header>

  <main>
    <section>
      <h2>About Me</h2>
      <p>
        I'm TJ, a BSIT student under block 3-7. Outside of school, I play games,
        do art, and I'm currently grinding FFXIV.
      </p>
    </section>

    <section>
      <h2>Interests</h2>
      <ul>
        <li>Gaming</li>
        <li>Art</li>
        <li>Final Fantasy XIV</li>
      </ul>
    </section>

    <section>
      <h2>Goal</h2>
      <p>Finish college.</p>
    </section>

    <section>
      <h2>Gallery</h2>
      <div class="gallery">
        <div class="gallery-item">
          <img src="Cyrene Character Trailer： ＂With You Once More＂ ｜ Honkai： Star Rail [CRAuK8T6Xis].mp4_snapshot_02.59.560.png" alt="Photo 1">
        </div>
        <div class="gallery-item">
          <img src="ffxiv_08122026_195359_638.png" alt="Photo 2">
        </div>
        <div class="gallery-item">
          <img src="ffxiv_08142026_102917_403.png" alt="Photo 3">
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>TJ · BSIT 3-7 · ITEC65B Laboratory Exercise 1</p>
  </footer>

</body>
</html>
